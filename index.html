<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="A 1:1 recreation of the Team Fortress 2 warpaint and lighting engine, in your browser."
    />
    <meta name="theme-color" content="#4c8dff" />
    <link rel="canonical" href="https://rhgx.github.io/warpaint-viewer/" />

    <!-- Social previews (Discord, Slack, iMessage, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TF2 Warpaint Viewer" />
    <meta property="og:title" content="TF2 Warpaint Viewer" />
    <meta
      property="og:description"
      content="A 1:1 recreation of the TF2 warpaint and lighting engine, in your browser."
    />
    <meta property="og:url" content="https://rhgx.github.io/warpaint-viewer/" />
    <meta property="og:image" content="https://rhgx.github.io/warpaint-viewer/social-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="TF2 Warpaint Viewer" />
    <meta
      name="twitter:description"
      content="A 1:1 recreation of the TF2 warpaint and lighting engine, in your browser."
    />
    <meta name="twitter:image" content="https://rhgx.github.io/warpaint-viewer/social-preview.png" />
    <meta name="twitter:image:alt" content="TF2 Warpaint Viewer logo" />
    <title>TF2 Warpaint Viewer</title>
    <!-- Matches --bg in tokens.css; the stylesheets arrive too late to prevent a white flash. -->
    <style>
      html {
        background: #16181c;
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Must parse in any browser, so no modern JavaScript here. main.tsx starts nothing without #root. -->
    <script>
      (function () {
        var css = window.CSS;
        // color-mix() is the Chrome 111 floor; registerProperty is Firefox 128 and Safari 16.4.
        if (css && css.supports && css.registerProperty && css.supports('color', 'color-mix(in srgb, red, red)')) return;
        var root = document.getElementById('root');
        var message = document.createElement('p');
        message.style.cssText = 'margin: 0; padding: 16px; color: #eef0f3; font: 14px/1.5 sans-serif';
        message.textContent = 'This browser is too old for Warpaint Viewer. Update it to continue.';
        root.parentNode.replaceChild(message, root);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
